name: BitChord
options:
  bundleIdPrefix: com.bitchord
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
targets:
  BitChord:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bitchord.ios
        INFOPLIST_KEY_CFBundleDisplayName: BitChord
    scheme:
      testTargets:
        - BitChordTests
  BitChordTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BitChord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bitchord.ios.tests
        GENERATE_INFOPLIST_FILE: YES
