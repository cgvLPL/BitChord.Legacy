name: BitChord
options:
  bundleIdPrefix: com.bitchord
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: BitChord
    INFOPLIST_KEY_UIBackgroundModes: "audio"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  BitChord:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bitchord.ios
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "BitChord does not require microphone access for basic playback."
    scheme:
      gatherCoverageData: false
